name: Release

# Tag-driven release. To cut a release:
#   1. Bump `version` in pyproject.toml and add a CHANGELOG.md section
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# PyPI publishing uses Trusted Publishing (OIDC) -- no API token is stored.
#
# The PyPI project is `audiobookifier`; the GitHub repo is still `audiobookify`.
# They differ on purpose -- the `audiobookify` name on PyPI belongs to an account
# we no longer control, and holds an unreachable 2.3.0. Console scripts are
# unaffected: `pip install audiobookifier` still gives you `audiobookify`.
#
# Until the first release lands, the publisher is PENDING and is configured at
#   https://pypi.org/manage/account/publishing/
# Afterwards it moves to
#   https://pypi.org/manage/project/audiobookifier/settings/publishing/
#
#   PyPI project: audiobookifier
#   Owner: loganrooks / Repository: audiobookify   <- GitHub repo, not the dist name
#   Workflow: release.yml / Environment: pypi

# A workflow_dispatch run is ALWAYS a dry run: every publishing job is gated on
# `github.event_name == 'push'`, so only a tag can publish. There used to be a
# `dry_run` input here, which was never referenced by any job -- setting it to
# false did not publish. It implied a control that did not exist, so it is gone.
# Dispatch this workflow freely to rehearse a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify tag matches package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check tag against pyproject version
        id: check
        run: |
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $PROJECT_VERSION"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag version: $TAG_VERSION"
            if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PROJECT_VERSION"
              exit 1
            fi
          fi

      - name: Check CHANGELOG has an entry for this version
        run: |
          if ! grep -q "^## \[${{ steps.check.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.check.outputs.version }}]' section"
            exit 1
          fi

  build:
    name: build and verify distribution
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          INSTALLED=$(/tmp/smoke/bin/audiobookify --version | awk '{print $2}')
          echo "installed version: $INSTALLED"
          test "$INSTALLED" = "${{ needs.verify.outputs.version }}"
          /tmp/smoke/bin/python -c "from epub2tts_edge.audio_generator import enable_test_mode; enable_test_mode()"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The publishing jobs are the only consumers of the `dist` artifact, and they
  # never run on a pull request -- so upload-artifact -> download-artifact was an
  # untested pairing whose first real execution would have been inside a release,
  # at the step that feeds dist/ to PyPI, after the tag already existed.
  # This job exercises exactly that round-trip on every dispatch instead.
  verify-artifact:
    name: verify artifact round-trip
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: The downloaded artifact must be installable
        run: |
          ls -l dist/
          test -n "$(find dist -name '*.whl' -print -quit)" \
            || { echo "::error::no wheel in the downloaded artifact"; exit 1; }
          test -n "$(find dist -name '*.tar.gz' -print -quit)" \
            || { echo "::error::no sdist in the downloaded artifact"; exit 1; }
          python -m venv /tmp/roundtrip
          /tmp/roundtrip/bin/pip install --quiet dist/*.whl
          INSTALLED=$(/tmp/roundtrip/bin/audiobookify --version | awk '{print $2}')
          test "$INSTALLED" = "${{ needs.verify.outputs.version }}" \
            || { echo "::error::downloaded wheel reports $INSTALLED"; exit 1; }
          echo "round-trip verified: upload-artifact -> download-artifact -> $INSTALLED"

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/audiobookifier
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    name: publish image to GHCR
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.verify.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deliberately does NOT depend on publish-pypi.
  #
  # `always()` is not sufficient on its own: `needs` waits for a dependency to
  # reach a TERMINAL state, and always() only decides whether this job then
  # runs. So listing publish-pypi tolerates it FAILING but still blocks on it
  # PENDING -- and publish-pypi sits behind a required environment review, which
  # can stay pending indefinitely. Observed on the v2.6.0 release: the image had
  # already published to GHCR while this job had not even been created, because
  # the PyPI approval was outstanding.
  #
  # publish-docker is safe to depend on because nothing gates it. The gate that
  # actually matters is `build`: no dist, no Release.
  github-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-docker]
    if: |
      always()
      && github.event_name == 'push'
      && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
