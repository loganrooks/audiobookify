name: Release

# Tag-driven release. To cut a release:
#   1. Bump `version` in pyproject.toml and add a CHANGELOG.md section
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# PyPI publishing uses Trusted Publishing (OIDC) -- no API token is stored.
#
# The PyPI project is `audiobookifier`; the GitHub repo is still `audiobookify`.
# They differ on purpose -- the `audiobookify` name on PyPI belongs to an account
# we no longer control, and holds an unreachable 2.3.0. Console scripts are
# unaffected: `pip install audiobookifier` still gives you `audiobookify`.
#
# Until the first release lands, the publisher is PENDING and is configured at
#   https://pypi.org/manage/account/publishing/
# Afterwards it moves to
#   https://pypi.org/manage/project/audiobookifier/settings/publishing/
#
#   PyPI project: audiobookifier
#   Owner: loganrooks / Repository: audiobookify   <- GitHub repo, not the dist name
#   Workflow: release.yml / Environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify tag matches package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tag against pyproject version
        id: check
        run: |
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $PROJECT_VERSION"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag version: $TAG_VERSION"
            if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PROJECT_VERSION"
              exit 1
            fi
          fi

      - name: Check CHANGELOG has an entry for this version
        run: |
          if ! grep -q "^## \[${{ steps.check.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.check.outputs.version }}]' section"
            exit 1
          fi

  build:
    name: build and verify distribution
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          INSTALLED=$(/tmp/smoke/bin/audiobookify --version | awk '{print $2}')
          echo "installed version: $INSTALLED"
          test "$INSTALLED" = "${{ needs.verify.outputs.version }}"
          /tmp/smoke/bin/python -c "from epub2tts_edge.audio_generator import enable_test_mode; enable_test_mode()"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/audiobookifier
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    name: publish image to GHCR
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.verify.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-docker]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
