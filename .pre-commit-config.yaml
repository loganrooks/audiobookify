# Pre-commit hooks for audiobookify
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  # NOTE: this rev MUST stay in sync with the ruff pin in pyproject.toml [dev].
  # ruff's formatter output changes between minor versions, so a mismatch makes
  # pre-commit and CI reformat each other's work indefinitely.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Check for common security issues
  # NOTE: keep this rev in sync with the bandit pin in pyproject.toml [dev].
  # Version skew changes which checks run: 1.7.10 reports B320 on lxml calls
  # that 1.9.4 does not, so a mismatch makes local and CI results disagree.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # -ll gates on medium+ severity, matching .github/workflows/ci.yml.
        # Without it, bandit exits 1 on low-severity subprocess notices and
        # blocks every commit.
        args: ["-c", "pyproject.toml", "-r", "epub2tts_edge/", "-ll"]
        # pre-commit appends staged filenames by default, which collide with
        # the -r target above and make bandit's argument parser fail. Scan the
        # configured directory instead, exactly as CI does.
        pass_filenames: false
        additional_dependencies: ["bandit[toml]"]

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
