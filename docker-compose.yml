# Docker Compose for Audiobookify
#
# Usage:
#   # Build the image
#   docker compose build
#
#   # Run with default help
#   docker compose run --rm audiobookify
#
#   # Convert a book
#   docker compose run --rm audiobookify /books/mybook.epub
#   docker compose run --rm audiobookify /books/mybook.txt
#
#   # Batch processing
#   docker compose run --rm audiobookify /books --batch
#
#   # Interactive shell
#   docker compose run --rm --entrypoint bash audiobookify

# Note: the top-level `version` key is obsolete in Compose v2 and is omitted.

services:
  audiobookify:
    build: .
    image: audiobookify:latest
    volumes:
      # Mount your books directory here
      - ./books:/books
    working_dir: /books
